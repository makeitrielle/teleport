<text x="70" y="1332" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172b89">NOTES</text>
<text x="70" y="1365" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#222222">1. Matching net labels are electrically connected. Cable shields and USB-C CC contacts are omitted.</text>
<text x="70" y="1396" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#222222">2. USB pin numbers apply to Type-A / Type-B USB 2.0 contacts. Use complete commercial cables, not loose wires.</text>
<text x="70" y="1427" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#222222">3. *Use 5V only when the monitor specifies 5V. Printer power comes from PS3, not from USB VBUS.</text>
