<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="1340" viewBox="0 0 1850 1340">
<rect width="100%" height="100%" fill="white"/>
<text x="80" y="74" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#20252b" text-anchor="start">TELE-PORT KIOSK — EQUIPMENT CONNECTION SCHEMATIC</text>
<text x="80" y="121" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20252b" text-anchor="start">Lenovo ThinkCentre M710q Tiny • touchscreen monitor • XP-58 thermal printer</text>
<text x="80" y="163" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#20252b" text-anchor="start">Based on your earlier touchscreen: Mini HDMI video + USB-C touch + separate USB-C power.</text>
<rect x="100" y="260" width="580" height="500" fill="white" stroke="#9b2020" stroke-width="3"/>
<text x="122" y="310" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#20252b" text-anchor="start">U1  LENOVO THINKCENTRE M710q</text>
